name: Release alles-in-één

on:
  push:
    tags: ['v*.*.*']

permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/lvos04/my_house

jobs:
  image:
    if: github.repository == 'lvos04/my_house'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.controle.outputs.version }}
      digest: ${{ steps.bouw.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Controleer de tag en de beschikbaarheid van de versie
        id: controle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash infra/scripts/controleer_release.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bouw en publiceer de alles-in-één-image
        id: bouw
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/allinone/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.controle.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.controle.outputs.version }}
          provenance: true
          sbom: true

  release:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: read
    env:
      VERSION: ${{ needs.image.outputs.version }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Leg de registerdigest voor het installatiemanifest vast
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p release
          jq -n --arg v "$VERSION" --arg image "$IMAGE" --arg digest "$DIGEST" \
            '{app_id: "smart-home", version: $v, image: $image, tag: $v, digest: $digest}' > release/digests.json
      - name: Maak de SPDX-SBOM van de gepubliceerde digest
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ env.DIGEST }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: release/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Publiceer de release met beide bijlagen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bron="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME"
          uitleg="Vul in TrueNAS de tag en digest uit digests.json in. De pakketlijst staat in sbom.spdx.json."
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "my_house $GITHUB_REF_NAME" \
            --notes "$uitleg [Custom App-formulier]($bron/deploy/truenas/CUSTOM_APP.md) · [Wijzigingen]($bron/CHANGELOG.md)" \
            release/digests.json release/sbom.spdx.json
