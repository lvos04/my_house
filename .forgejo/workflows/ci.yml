name: CI
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  # Forgejo leest het bronsecret bij de backendstap van deze lokale workflow.
  workflow_call:

permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  backend:
    runs-on: ubuntu-24.04
    env:
      SHC_CI_PGROOT: /dev/shm
      SHC_CI_BACKENDIMAGE: ghcr.io/catthehacker/ubuntu:act-24.04@sha256:7bf3a8afc2bbfe7fdaf4b9d2716cb2f3634fd21e4f38e26aa17a12cfda80d721
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          # De historische versiewissels pakken de oorspronkelijke commits uit met git archive.
          fetch-depth: 0
      - run: bash .forgejo/ci/python.sh backend
      - name: Lint op API, integraties en hulpmiddelen
        run: |
          ruff check apps/api/src apps/api/tests
          ruff check --config apps/api/pyproject.toml infra/scripts infra/e2e infra/tests tools
          pipx run ruff==0.17.4 check integrations
      - name: Platformcontract en Peil vergelijken met de pin en de bronbranch
        env:
          BRON_LEESTOKEN: ${{ secrets.BRON_LEESTOKEN }}
        run: bash .forgejo/ci/broncontrole.sh
      - name: Adaptercontracten
        run: python -m pytest -q integrations/tests
      - name: API, engine, migraties en historische versiewissels
        run: bash .forgejo/ci/backendproef.sh
      - name: Python-afhankelijkheden controleren
        run: |
          pip freeze --exclude-editable > "$RUNNER_TEMP/requirements.txt"
          cache=$(mktemp -d "$RUNNER_TEMP/pip-audit.XXXXXXXX")
          XDG_CACHE_HOME="$cache" pipx run pip-audit==2.10.1 --cache-dir "$cache/pypi" --no-deps --disable-pip --progress-spinner off -r "$RUNNER_TEMP/requirements.txt"

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: "22"}
      - id: werk
        run: bash .forgejo/ci/webwerkmap.sh
      - name: Pakketten installeren, typen controleren, testen, bouwen en auditen
        run: |
          cd "$WEBBRON/apps/web"
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --shm-size=1g
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: "22"}
      - id: werk
        run: bash .forgejo/ci/webwerkmap.sh
      - run: |
          cd "$WEBBRON"
          bash .forgejo/ci/python.sh e2e
      - name: Typecontrole en Chromium voor de browsertests
        run: |
          cd "$WEBBRON/apps/web"
          npm ci
          node node_modules/typescript/bin/tsc -p e2e/tsconfig.json
          node node_modules/@playwright/test/cli.js install chromium
      - name: Browsertests tegen de lokale webapp, API en PostgreSQL
        run: |
          cd "$WEBBRON"
          bash .forgejo/ci/postgresproef.sh e2e
      - name: Testrapport en traces
        if: failure()
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: e2e-report
          path: ${{ steps.werk.outputs.pad }}/apps/web/e2e/.output/
          retention-days: 14
          if-no-files-found: ignore

  compose:
    runs-on: ubuntu-24.04
    env:
      ASF_COMMIT: 5ece4a31b18c71f5c4d82034148e486eb3d12302
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - name: ShellCheck en vaste basisimages
        run: |
          bash .forgejo/ci/pakketlijst.sh
          apt-get install -y --no-install-recommends shellcheck busybox python3-yaml python3.12-venv
          shellcheck infra/scripts/*.sh apps/web/docker/*.sh apps/web/e2e/*.sh .forgejo/ci/*.sh
          python3 infra/scripts/check_dockerfile_digests.py
      - run: /usr/bin/python3 -m unittest discover -s infra/tests -v
      - name: Compose-profielen en TrueNAS-renderingen met testwaarden
        run: bash infra/scripts/validate_compose.sh
      - name: Lees de gepinde manifestvalidator
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: leon/appstore-en-fork
          ref: ${{ env.ASF_COMMIT }}
          path: .appstore-validator
          github-server-url: https://git.medialeon.nl
          token: ${{ secrets.BRON_LEESTOKEN }}
          persist-credentials: false
          sparse-checkout: apps/api
      - name: Valideer het manifest en toets de weigergevallen
        run: |
          test "$(git -C .appstore-validator rev-parse HEAD)" = "$ASF_COMMIT"
          python3.12 -m venv "$RUNNER_TEMP/validator"
          "$RUNNER_TEMP/validator/bin/pip" install --require-hashes --only-binary=:all: -r .appstore-validator/apps/api/requirements.lock
          "$RUNNER_TEMP/validator/bin/pip" install --no-deps .appstore-validator/apps/api
          JL_MANIFEST="$RUNNER_TEMP/validator/bin/jl-manifest" /usr/bin/python3 -m unittest -v infra.tests.manifestproef

  allinone:
    name: Custom App-rechten en migratiebewijs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SHC_VERSION: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - name: Alles-in-één-image bouwen
        run: |
          docker buildx build --load --provenance=false -f deploy/allinone/Dockerfile -t "my_house-aio:$SHC_VERSION" .
          docker buildx build --load -t "my_house-aio-proef:$SHC_VERSION" -f - .forgejo/ci <<EOF
          FROM my_house-aio:$SHC_VERSION
          COPY --chmod=0555 broker-start.sh /usr/local/bin/mosquitto
          EOF
      - name: Rechten, Zigbee, HTTP, PostgreSQL-dump en versleuteld herstel van A in B
        id: proef
        run: bash .forgejo/ci/containerproef.sh allinone
      - name: Bewaar het gemeten herstelbewijs
        if: ${{ !cancelled() && steps.proef.outputs.herstelbewijs == 'true' }}
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
        with:
          name: herstelproef-a-naar-b
          path: ${{ runner.temp }}/herstelproef.md
          if-no-files-found: error
      - if: always()
        run: docker image rm "my_house-aio-proef:$SHC_VERSION" "my_house-aio:$SHC_VERSION" || true

  stack:
    name: Images, scan, rooktest en browsertests
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      SHC_VERSION: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - name: API en web bouwen en de inhoud van de API-image toetsen
        run: |
          versie=$(tr -d '[:space:]' < VERSION)
          docker buildx build --load --provenance=false --build-arg "APP_VERSION=$versie" -f apps/api/Dockerfile -t "shc-api:$SHC_VERSION" .
          docker buildx build --load --provenance=false --build-arg "APP_VERSION=$versie" -t "shc-web:$SHC_VERSION" apps/web
          docker run --rm --entrypoint sh "shc-api:$SHC_VERSION" -c 'pg_dump --version && cat /app/VERSION' | tee "$RUNNER_TEMP/api.txt"
          grep -q 'PostgreSQL) 16\.' "$RUNNER_TEMP/api.txt"
          grep -Fx "$versie" <(tail -n1 "$RUNNER_TEMP/api.txt")
      - name: Beide images met Trivy controleren
        run: |
          bash .forgejo/ci/scan.sh "shc-api:$SHC_VERSION"
          bash .forgejo/ci/scan.sh "shc-web:$SHC_VERSION"
      - name: Broker met de vaste stackconfiguratie bouwen
        run: |
          bron=$(docker compose -f infra/compose/compose.yaml config --images | grep '^eclipse-mosquitto:.*@sha256:')
          context=$(mktemp -d "$RUNNER_TEMP/broker.XXXXXXXX")
          trap 'rm -r "$context"' EXIT
          sed 's|/mosquitto/config/|/etc/mosquitto/|g; s|/mosquitto/data/|/var/lib/mosquitto/|g' \
            infra/compose/config/mosquitto.conf > "$context/mosquitto.conf"
          docker buildx build --load -t "shc-mosquitto:$SHC_VERSION" -f - "$context" <<EOF
          FROM $bron
          RUN mkdir -p /etc/mosquitto && chmod 0755 /etc/mosquitto
          COPY --chown=1883:1883 --chmod=0644 mosquitto.conf /etc/mosquitto/mosquitto.conf
          CMD ["/usr/sbin/mosquitto", "-c", "/etc/mosquitto/mosquitto.conf"]
          EOF
      - name: Rooktest via nginx, back-up verifiëren, API-herstart en browsertests met de worker
        run: bash .forgejo/ci/containerproef.sh stack
      - if: failure()
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
        with:
          name: e2e-compose-report
          path: infra/e2e/.output/
          retention-days: 14
          if-no-files-found: ignore
      - if: always()
        run: docker image rm "shc-api:$SHC_VERSION" "shc-web:$SHC_VERSION" "shc-mosquitto:$SHC_VERSION" || true
