name: Edge images

# Every push to main: the full CI (same jobs as for a pull request), then images tagged "edge"
# for testing a version before it is released (provenance + SBOM, signed with cosign).
# Releases come from release.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: edge
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  images:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign trades GitHub's OIDC token for a short-lived Sigstore certificate
      # that names this workflow; no signing key exists anywhere.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: p
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=$(tr -d '[:space:]' < VERSION)-edge" >> "$GITHUB_OUTPUT"
      - id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: APP_VERSION=${{ steps.p.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.p.outputs.prefix }}-api:edge
      - id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/web
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: APP_VERSION=${{ steps.p.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.p.outputs.prefix }}-web:edge
      # Signed by digest (exactly what was pushed; "edge" moves with every push): the multi-arch
      # index. Verified right away with the identity users check against.
      - name: Sign the images (cosign, keyless)
        env:
          API_IMAGE: ${{ steps.p.outputs.prefix }}-api@${{ steps.api.outputs.digest }}
          WEB_IMAGE: ${{ steps.p.outputs.prefix }}-web@${{ steps.web.outputs.digest }}
        run: |
          set -euo pipefail
          identity="$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF"
          for ref in "$API_IMAGE" "$WEB_IMAGE"; do
            cosign sign --yes "$ref"
            cosign verify "$ref" --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          done
          {
            echo "### Ondertekende edge-images"
            echo "- \`$API_IMAGE\`"
            echo "- \`$WEB_IMAGE\`"
            echo "Identiteit: \`$identity\`"
          } >> "$GITHUB_STEP_SUMMARY"
