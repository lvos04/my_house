[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shc-integrations"
version = "0.1.0"
description = "Local device adapters (Hue, HomeWizard, Gree, Zigbee2MQTT) for Smart Home Control"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<0.29",
  "cryptography>=43,<51",
  "aiomqtt>=2.3,<3",
]

[project.optional-dependencies]
discovery = ["zeroconf>=0.132,<1"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "respx>=0.21,<0.24", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["B027", "ASYNC109", "UP047"]
