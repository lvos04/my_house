name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.6-alpine3.21
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SHC_TEST_PG: postgresql://postgres@127.0.0.1:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "integrations[test]" -e "apps/api[dev]"
      - name: Lint
        run: |
          ruff check apps/api/src apps/api/tests
          ruff check integrations
      - name: Adapter contract tests
        run: pytest -q integrations/tests
      - name: API, engine and migration tests
        working-directory: apps/api
        run: pytest -q tests
      - name: TrueNAS YAML renders and is valid compose
        run: |
          python3 infra/scripts/render_truenas.py --root /mnt/tank/apps/smart-home > /tmp/tn.yaml
          docker compose -f /tmp/tn.yaml config -q

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  images:
    needs: [backend, web]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: v
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="${GITHUB_REF#refs/tags/v}"; else tag="edge"; fi
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.v.outputs.prefix }}-api:${{ steps.v.outputs.tag }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.v.outputs.prefix }}-web:${{ steps.v.outputs.tag }}
