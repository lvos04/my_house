[project]
name = "shc-api"
version = "0.1.0"
description = "Smart Home Control API, worker en klimaat/energie-engine"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.33",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30,<0.31",
  "alembic>=1.14,<1.15",
  "pydantic-settings>=2.6,<2.7",
  "argon2-cffi>=23.1,<24",
  "cryptography>=43,<46",
  "httpx>=0.28,<0.29",
  "shc-integrations",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<0.25", "ruff>=0.8,<0.9"]

[project.scripts]
shc-api = "shc_api.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shc_api = ["migrations/*.ini", "migrations/*.py", "migrations/versions/*.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008", "S311", "ASYNC110"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S603", "S607", "E501"]
