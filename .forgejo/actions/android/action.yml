name: Android-toolchain
description: JDK 17, Android 35 en de gecontroleerde Gradle-wrapper voor beide APK-jobs
runs:
  using: composite
  steps:
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: temurin
        java-version: "17"
        cache: gradle
        cache-dependency-path: |
          apps/android/**/*.gradle.kts
          apps/android/gradle/libs.versions.toml
          apps/android/gradle/wrapper/gradle-wrapper.properties
    - shell: bash
      run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
    - uses: https://github.com/gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
