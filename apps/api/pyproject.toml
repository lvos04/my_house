[project]
name = "shc-api"
# Placeholder, never bumped (verbeterlijst 41): the app version comes only from the repository's
# VERSION file (shc_api.config.VERSION, contract C9: /app/VERSION in the image). A dynamic version
# would need a setup hook that reads ../../VERSION, which is outside this package and missing from
# an sdist build; nothing reads the package metadata version.
version = "0.0.0"
description = "Smart Home Control API, worker en klimaat/energie-engine"
requires-python = ">=3.12"
# Floors are the first releases without known vulnerabilities (pip-audit gate in CI, item 41).
dependencies = [
  "fastapi>=0.162.2,<0.163",
  "starlette>=1.3.1,<2",
  "uvicorn[standard]>=0.32.1,<0.33",
  "sqlalchemy[asyncio]>=2.0.57,<2.1",
  "asyncpg>=0.30,<0.31",
  "alembic>=1.14.1,<1.15",
  "pydantic-settings>=2.6.1,<2.7",
  "argon2-cffi>=23.1,<24",
  "cryptography>=50.0.2,<51",
  "httpx>=0.28.1,<0.29",
  "h11>=0.16",
  "shc-integrations",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "pytest-asyncio>=1.3,<2", "ruff>=0.17.4,<0.18"]

[project.scripts]
shc-api = "shc_api.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shc_api = ["migrations/*.ini", "migrations/*.py", "migrations/versions/*.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008", "S311", "ASYNC110"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S603", "S607", "E501"]
