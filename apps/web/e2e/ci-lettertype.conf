<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Laat de browsertests lokaal met het systeemlettertype van de CI-machine draaien.

  De web-app gebruikt het systeemlettertype (system-ui). Op een ontwikkelmachine met Noto Sans is dat
  smaller dan DejaVu Sans, het lettertype waarop de CI-machine uitkomt. Een label dat lokaal net past,
  kan in CI buiten zijn vlak steken. Dit bestand verbergt Noto Sans voor fontconfig, zodat system-ui
  op DejaVu Sans uitkomt (als dat geïnstalleerd is). Het verandert niets aan het systeem zelf.

  Gebruik (zie README.md): FONTCONFIG_FILE="$PWD/apps/web/e2e/ci-lettertype.conf" apps/web/e2e/run-stack.sh
  Controle:                FONTCONFIG_FILE="$PWD/apps/web/e2e/ci-lettertype.conf" fc-match system-ui
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family"><string>Noto Sans</string></patelt>
      </pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
